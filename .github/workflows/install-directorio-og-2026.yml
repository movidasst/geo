name: Install Directorio OG image
on:
  push:
    paths:
      - '.github/workflows/install-directorio-og-2026.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image library
        run: python -m pip install Pillow
      - name: Create optimized social image from approved high-resolution original
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          from io import BytesIO
          src=Path('og-directorio-fuente-temporal.png')
          dst=Path('og-directorio-sst-20261021.jpg')
          if not src.is_file(): raise RuntimeError('Approved original missing')
          with Image.open(src) as original:
              print('Original size:', original.size, 'file bytes:',src.stat().st_size)
              picture=ImageOps.fit(original.convert('RGB'),(1200,630),method=Image.Resampling.LANCZOS)
          for quality in [89,86,83,80,77,74,70,66,62,58,54]:
              buffer=BytesIO()
              picture.save(buffer,format='JPEG',quality=quality,optimize=True,progressive=True,subsampling=2)
              if buffer.tell()<=340000:
                  dst.write_bytes(buffer.getvalue())
                  break
          else: raise RuntimeError('Cannot optimize under 340 KB')
          with Image.open(dst) as check:
              check.verify()
          print('Saved WhatsApp banner:',dst,'bytes:',dst.stat().st_size,'quality:',quality)
          PY
      - name: Save optimized banner
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add og-directorio-sst-20261021.jpg
          git commit -m 'Install optimized official Directorio SST social banner' || exit 0
          git push
