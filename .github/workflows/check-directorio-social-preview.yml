name: Verify Directorio WhatsApp preview
on:
  push:
    paths:
      - '.github/workflows/check-directorio-social-preview.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check Open Graph and image from public server
        shell: bash
        run: |
          set -euo pipefail
          SITE='https://directorio.movidasst.com/'
          IMG='https://directorio.movidasst.com/og-directorio-sst-20261021.jpg'
          for n in $(seq 1 15); do
            curl -fsSL -A 'WhatsApp/2.26.21.10' --max-time 20 "${SITE}?preview_check=20261021-${n}" -o /tmp/page.html
            if grep -Fq "$IMG" /tmp/page.html; then
              echo "Meta tags verified at attempt ${n}"
              break
            fi
            sleep 7
          done
          grep -F 'og:image' /tmp/page.html | head -n 4
          grep -Fq "$IMG" /tmp/page.html
          grep -Fq '<meta property="og:image:width" content="1200">' /tmp/page.html
          grep -Fq '<meta property="og:image:height" content="630">' /tmp/page.html
          curl -fsSL --max-time 25 -A 'WhatsApp/2.26.21.10' -D /tmp/image-headers.txt "$IMG" -o /tmp/image.jpg
          grep -Ei '^HTTP/|^content-type:|^content-length:' /tmp/image-headers.txt | tail -n 8
          file /tmp/image.jpg
          file --mime-type /tmp/image.jpg | grep -q 'image/jpeg'
          BYTES=$(wc -c < /tmp/image.jpg)
          echo "DIRECTORIO_SOCIAL_IMAGE_SIZE=${BYTES}"
          test "$BYTES" -gt 10000
          test "$BYTES" -lt 350000
