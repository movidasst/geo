name: Sync credential academic catalog

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-academic-catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update Carrera and Postgrado controls
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app.html')
          text = path.read_text(encoding='utf-8')

          old_career = '<input id="member-career" name="carrera" type="text" maxlength="160" autocomplete="organization-title" placeholder="Ej. Ingeniería Industrial" required>'
          new_career = '''<div class="member-data-select-wrap">
                                        <select id="member-career" name="carrera" required>
                                            <option value="">Selecciona tu carrera</option>
                                            <option value="TSU en Higiene y Seguridad Laboral">TSU en Higiene y Seguridad Laboral</option>
                                            <option value="Ingeniería en HSL">Ingeniería en HSL</option>
                                            <option value="Seguridad y Salud en el Trabajo">Seguridad y Salud en el Trabajo</option>
                                            <option value="Higiene Ocupacional">Higiene Ocupacional</option>
                                            <option value="Seguridad Industrial">Seguridad Industrial</option>
                                            <option value="Prevención de Riesgos">Prevención de Riesgos</option>
                                            <option value="Ingeniería Industrial">Ingeniería Industrial</option>
                                            <option value="Ingeniería Ambiental">Ingeniería Ambiental</option>
                                            <option value="Ingeniería Química">Ingeniería Química</option>
                                            <option value="Ingeniería Mecánica">Ingeniería Mecánica</option>
                                            <option value="Ingeniería Eléctrica">Ingeniería Eléctrica</option>
                                            <option value="Ingeniería Civil">Ingeniería Civil</option>
                                            <option value="Ingeniería de Producción">Ingeniería de Producción</option>
                                            <option value="Ingeniería de Procesos">Ingeniería de Procesos</option>
                                            <option value="Enfermería">Enfermería</option>
                                            <option value="Medicina">Medicina</option>
                                            <option value="Psicología">Psicología</option>
                                            <option value="Fisioterapia">Fisioterapia</option>
                                            <option value="Terapia Ocupacional">Terapia Ocupacional</option>
                                            <option value="Derecho">Derecho</option>
                                            <option value="Recursos Humanos">Recursos Humanos</option>
                                            <option value="Gestión de Riesgos / Protección Civil">Gestión de Riesgos / Protección Civil</option>
                                            <option value="Otra">Otra</option>
                                        </select>
                                    </div>
                                    <input id="member-career-other" type="text" maxlength="160" placeholder="Especifica tu carrera o profesión" hidden>'''
          if old_career in text:
              if text.count(old_career) != 1:
                  raise SystemExit(f'Se esperaban 1 campo carrera, encontrados {text.count(old_career)}')
              text = text.replace(old_career, new_career, 1)
          elif 'id="member-career-other"' not in text:
              raise SystemExit('No se encontró el campo Carrera esperado')

          old_postgrad = '<input id="member-postgraduate" name="postgrado" type="text" maxlength="160" placeholder="Ej. Maestría en SST">'
          new_postgrad = '''<div class="member-data-select-wrap">
                                        <select id="member-postgraduate" name="postgrado">
                                            <option value="">Selecciona una opción</option>
                                            <option value="__NONE__">Ninguno / No aplica</option>
                                            <option value="Especialización">Especialización</option>
                                            <option value="Master">Master</option>
                                            <option value="Maestría">Maestría</option>
                                            <option value="Magíster">Magíster</option>
                                        </select>
                                    </div>'''
          if old_postgrad in text:
              if text.count(old_postgrad) != 1:
                  raise SystemExit(f'Se esperaban 1 campo postgrado, encontrados {text.count(old_postgrad)}')
              text = text.replace(old_postgrad, new_postgrad, 1)
          elif '<option value="Magíster">Magíster</option>' not in text:
              raise SystemExit('No se encontró el campo Postgrado esperado')

          old_dom = "                career: document.getElementById('member-career'),\n                postgraduate: document.getElementById('member-postgraduate'),"
          new_dom = "                career: document.getElementById('member-career'),\n                careerOther: document.getElementById('member-career-other'),\n                postgraduate: document.getElementById('member-postgraduate'),"
          if old_dom in text:
              if text.count(old_dom) != 1:
                  raise SystemExit(f'Se esperaba 1 bloque DOM académico, encontrados {text.count(old_dom)}')
              text = text.replace(old_dom, new_dom, 1)
          elif "careerOther: document.getElementById('member-career-other')" not in text:
              raise SystemExit('No se encontró el bloque DOM del editor')

          old_load = "                editor.career.value = (data.carrera || data.Carrera || '').toString().trim();\n                editor.postgraduate.value = (data.postgrado || data.Postgrado || '').toString().trim();"
          new_load = """                const carreraActual = (data.carrera || data.Carrera || '').toString().trim();
                establecerValorSelectSeguro(editor.career, carreraActual);
                if (editor.careerOther) {
                    const usarOtra = editor.career.value === 'Otra';
                    editor.careerOther.hidden = !usarOtra;
                    editor.careerOther.required = usarOtra;
                    if (!usarOtra) editor.careerOther.value = '';
                }
                const postgradoActual = (data.postgrado || data.Postgrado || '').toString().trim();
                establecerValorSelectSeguro(editor.postgraduate, postgradoActual);"""
          if old_load in text:
              if text.count(old_load) != 1:
                  raise SystemExit(f'Se esperaba 1 bloque de carga académica, encontrados {text.count(old_load)}')
              text = text.replace(old_load, new_load, 1)
          elif 'const carreraActual =' not in text or 'const postgradoActual =' not in text:
              raise SystemExit('No se encontró el bloque de carga académica')

          old_save = "                const carrera = editor.career.value.trim();\n                const postgrado = editor.postgraduate.value.trim();"
          new_save = """                const carreraSeleccionada = editor.career.value.trim();
                const carrera = carreraSeleccionada === 'Otra'
                    ? (editor.careerOther?.value || '').trim()
                    : carreraSeleccionada;
                const postgradoSeleccionado = editor.postgraduate.value.trim();
                const postgrado = postgradoSeleccionado === '__NONE__' ? '' : postgradoSeleccionado;

                if (carreraSeleccionada === 'Otra' && !carrera) {
                    setEditorStatus('Especifica tu carrera o profesión.', 'error');
                    editor.careerOther?.focus();
                    return;
                }"""
          if old_save in text:
              if text.count(old_save) != 1:
                  raise SystemExit(f'Se esperaba 1 bloque de guardado académico, encontrados {text.count(old_save)}')
              text = text.replace(old_save, new_save, 1)
          elif 'const carreraSeleccionada =' not in text:
              raise SystemExit('No se encontró el bloque de guardado académico')

          old_listener = "            if (editor.form) editor.form.addEventListener('submit', guardarDatosPerfil);"
          new_listener = """            if (editor.career) {
                editor.career.addEventListener('change', function () {
                    if (!editor.careerOther) return;
                    const usarOtra = editor.career.value === 'Otra';
                    editor.careerOther.hidden = !usarOtra;
                    editor.careerOther.required = usarOtra;
                    if (!usarOtra) editor.careerOther.value = '';
                    if (usarOtra) editor.careerOther.focus();
                });
            }
            if (editor.form) editor.form.addEventListener('submit', guardarDatosPerfil);"""
          if old_listener in text and 'editor.career.addEventListener' not in text:
              if text.count(old_listener) != 1:
                  raise SystemExit(f'Se esperaba 1 listener de formulario, encontrados {text.count(old_listener)}')
              text = text.replace(old_listener, new_listener, 1)
          elif 'editor.career.addEventListener' not in text:
              raise SystemExit('No se encontró el listener del formulario')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate academic catalog patch
        run: |
          set -euxo pipefail
          grep -F 'id="member-career" name="carrera"' app.html
          grep -F '<option value="Enfermería">Enfermería</option>' app.html
          grep -F '<option value="Psicología">Psicología</option>' app.html
          grep -F '<option value="Fisioterapia">Fisioterapia</option>' app.html
          grep -F '<option value="Derecho">Derecho</option>' app.html
          grep -F '<option value="Gestión de Riesgos / Protección Civil">Gestión de Riesgos / Protección Civil</option>' app.html
          grep -F 'id="member-career-other"' app.html
          grep -F '<option value="Master">Master</option>' app.html
          grep -F '<option value="Maestría">Maestría</option>' app.html
          grep -F '<option value="Magíster">Magíster</option>' app.html
          grep -F "careerOther: document.getElementById('member-career-other')" app.html
          grep -F "const postgrado = postgradoSeleccionado === '__NONE__' ? '' : postgradoSeleccionado;" app.html
          grep -F "editor.career.addEventListener('change'" app.html
          test "$(grep -c 'id="member-career" name="carrera"' app.html)" -eq 1
          test "$(grep -c 'id="member-postgraduate" name="postgrado"' app.html)" -eq 1

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.html
          if git diff --cached --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git commit -m 'Sync Carrera and Postgrado catalogs in credential editor'
          git push origin main
