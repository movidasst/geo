name: Migrar mapa SST a OpenFreeMap

on:
  push:
    paths:
      - '.github/workflows/openfreemap-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Migrar CARTO a OpenFreeMap
        run: python tools/migrate_openfreemap.py

      - name: Verificar resultado
        run: |
          if grep -qi 'basemaps.cartocdn.com' index.html; then exit 1; fi
          grep -q 'tiles.openfreemap.org/styles/positron' index.html
          grep -q 'leaflet-maplibre-gl' index.html

      - name: Publicar cambio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Migra el Directorio a OpenFreeMap y personaliza el mapa SST'
          git push
