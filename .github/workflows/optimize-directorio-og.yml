name: Install optimized Directorio preview
on:
  push:
    paths:
      - '.github/workflows/optimize-directorio-og.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Optimize official preview
        run: |
          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          from io import BytesIO
          src=Path('og-directorio-original-20261021.png')
          out=Path('og-directorio-sst-20261021.jpg')
          if not src.exists(): raise RuntimeError('Falta el original aprobado')
          with Image.open(src) as source:
              print('Original:',source.size,'bytes:',src.stat().st_size)
              picture=ImageOps.fit(source.convert('RGB'),(1200,630),method=Image.Resampling.LANCZOS)
          for quality in [88,85,82,79,76,73,70,66,62,58]:
              b=BytesIO()
              picture.save(b,'JPEG',quality=quality,optimize=True,progressive=True,subsampling=2)
              if b.tell() <= 330*1024:
                  out.write_bytes(b.getvalue())
                  break
          else: raise RuntimeError('La compresion no alcanzo el limite requerido')
          with Image.open(out) as verify:
              verify.verify()
          print('Result:',out,out.stat().st_size,'quality',quality)
          PY
      - name: Commit public lightweight preview
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add og-directorio-sst-20261021.jpg
          git rm -f og-directorio-original-20261021.png
          git commit -m 'Publish 1200x630 optimized Directorio OG banner'
          git push
