<body>
  <div id="boot">Cargando mapa SST…</div>
  <script>
    (async function () {
      try {
        const response = await fetch('./app.html?v=20260912-credencial-internacional-v5', { cache: 'no-store' });
        if (!response.ok) throw new Error('No se pudo cargar la aplicación base.');
        let html = await response.text();

        const mainBefore = "worldCopyJump: true,\n                minZoom: 2\n            }).setView([12, -45], 2);";
        const mainAfter = "worldCopyJump: true,\n                minZoom: 2,\n                maxZoom: 19\n            }).setView([12, -45], 2);";
        const validatorBefore = "L.map('valStateMap', { zoomControl: false, attributionControl: false }).setView";
        const validatorAfter = "L.map('valStateMap', { zoomControl: false, attributionControl: false, minZoom: 2, maxZoom: 19 }).setView";

        if (!html.includes(mainBefore)) throw new Error('No se encontró la configuración del mapa principal.');
        html = html.replace(mainBefore, mainAfter);
        html = html.replace(validatorBefore, validatorAfter);

        if (!html.includes('</head>')) throw new Error('No se encontró la cabecera de la aplicación base.');
        html = html.replace('</head>', '<link rel="stylesheet" href="./map-layout-responsive.css?v=20261021-mapa-v1"><script defer src="https://www.movidasst.com/analytics.js?v=20261025-ga4com2"><\/script></head>');

        if (!html.includes('</body>')) throw new Error('No se encontró el cierre de la aplicación base.');
        html = html.replace('</body>', '<script src="./geo335-patch.js?v=20260826-geo335-v1"><\/script><script src="./corporate-cta.js?v=20260829-corporate-v1"><\/script><script src="./hash-router.js?v=20260829-router-v1"><\/script><script src="./competency-badges.js?v=20260920-finanzas-v7"><\/script><script src="./mentoring-cta.js?v=20261021-mentoring-v1"><\/script><script src="./perfil-deeplink.js?v=20261025-ranking-v1"><\/script></body>');

        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        console.error(error);
        document.getElementById('boot').innerHTML = '<div style="max-width:520px;padding:24px;text-align:center"><strong>No fue posible iniciar el mapa.</strong><br><span style="display:block;margin-top:8px;font-size:13px;color:#52697a">' + String(error.message || error) + '</span></div>';
      }
    })();
  </script>
